name: Generate x86 instruction reference

on:
  push:
    branches:
      - docs/x86-instruction-reference
    paths:
      - scripts/generate-instruction-docs.py
      - scripts/generate-instruction-docs-reviewed.py
      - generated/xed-instructions.tsv
      - generated/xed-iclasses.txt
      - research/source-pins.json
      - .github/workflows/generate-instruction-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/x86-instruction-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed pages
        run: python3 scripts/generate-instruction-docs-reviewed.py
      - name: Verify deterministic regeneration
        run: python3 scripts/generate-instruction-docs-reviewed.py --check
      - name: Commit generated reference
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/instructions generated/instruction-doc-fallbacks.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate reviewed x86 instruction reference"
          git push origin HEAD:docs/x86-instruction-reference
