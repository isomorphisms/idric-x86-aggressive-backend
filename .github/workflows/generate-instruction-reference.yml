name: Generate x86 instruction reference

on:
  pull_request:
    paths:
      - scripts/generate-instruction-docs.py
      - scripts/generate-instruction-docs-reviewed.py
      - scripts/generate-instruction-docs-complete.py
      - scripts/validate-instruction-doc-rendering.py
      - scripts/bundle-instruction-docs.py
      - generated/xed-instructions.tsv
      - generated/xed-iclasses.txt
      - research/source-pins.json
      - research/vendor-differences.tsv
      - .github/workflows/generate-instruction-reference.yml
  push:
    branches:
      - docs/bundle-x86-instruction-reference
    paths:
      - scripts/generate-instruction-docs.py
      - scripts/generate-instruction-docs-reviewed.py
      - scripts/generate-instruction-docs-complete.py
      - scripts/validate-instruction-doc-rendering.py
      - scripts/bundle-instruction-docs.py
      - generated/xed-instructions.tsv
      - generated/xed-iclasses.txt
      - research/source-pins.json
      - research/vendor-differences.tsv
      - .github/workflows/generate-instruction-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalized metadata rendering
        run: python3 scripts/validate-instruction-doc-rendering.py
      - name: Generate complete reviewed instruction prose
        run: python3 scripts/generate-instruction-docs-complete.py
      - name: Require zero semantic fallbacks
        run: test ! -s generated/instruction-doc-fallbacks.txt
      - name: Bundle instruction reference by family
        run: python3 scripts/bundle-instruction-docs.py
      - name: Verify exact bundled coverage
        run: python3 scripts/bundle-instruction-docs.py --check
      - name: Commit generated reference on source-branch pushes only
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/instructions generated/instruction-doc-fallbacks.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bundle x86 instruction semantic reference"
          git push origin "HEAD:${GITHUB_REF_NAME}"
